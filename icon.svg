<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Porcelain Gradient -->
    <linearGradient id="bgCanvasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f9"/>
    </linearGradient>

    <!-- Google Blue to Sky Gradient -->
    <linearGradient id="m3PrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Emerald Mint Trajectory Gradient -->
    <linearGradient id="m3MintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Coral Spark Accent -->
    <linearGradient id="m3CoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff7961"/>
    </linearGradient>

    <!-- Soft Diffuse Material Elevation Shadow -->
    <filter id="m3Elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1a73e8" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a73e8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgCanvasGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="4"/>

  <!-- Ambient Dynamic Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(26, 115, 232, 0.05)" stroke-width="32" />

  <!-- 🌟 Expressive Well-Spent Logo Mark: Dual-Arc "W" Trajectory & Budget Loop 🌟 -->
  <g filter="url(#markGlow)">
    <!-- Outer Budget Progress Ring Arc (270-degree trajectory) -->
    <path d="M 140 256 A 120 120 0 1 1 376 256" fill="none" stroke="rgba(26, 115, 232, 0.12)" stroke-width="26" stroke-linecap="round"/>

    <!-- Active Gradient Budget Arc -->
    <path d="M 140 256 A 120 120 0 1 1 340 340" fill="none" stroke="url(#m3MintGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Interlocking Ribbon "W" Monogram & Sparkline -->
    <!-- Left Wing of W -->
    <path d="M 170 180 L 214 316 L 256 220 L 298 316 L 342 180" 
          fill="none" 
          stroke="url(#m3PrimaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Currency Node / Upward Trajectory Dot -->
    <circle cx="256" cy="180" r="22" fill="url(#m3PrimaryGrad)"/>
    <circle cx="256" cy="180" r="12" fill="#ffffff"/>

    <!-- Dynamic Sparkline Pulse Accents -->
    <circle cx="342" cy="180" r="10" fill="url(#m3CoralGrad)"/>
    <circle cx="170" cy="180" r="8" fill="url(#m3MintGrad)"/>
  </g>
</svg>
