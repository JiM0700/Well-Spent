<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121a2c"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Liquid Glass outer rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Wallet / Card Icon -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <rect x="0" y="60" width="300" height="190" rx="24" fill="url(#cardGrad)"/>
    <path d="M40 60 V 30 A 30 30 0 0 1 70 0 H 230 A 30 30 0 0 1 260 30 V 60" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
    <!-- Wallet latch -->
    <rect x="200" y="125" width="80" height="60" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="8"/>
    <circle cx="230" cy="155" r="10" fill="#60a5fa"/>
    <!-- Rupee symbol outline -->
    <text x="70" y="175" font-family="-apple-system, sans-serif" font-size="90" font-weight="900" fill="#ffffff">₹</text>
  </g>
</svg>
